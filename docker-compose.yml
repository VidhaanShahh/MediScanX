version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mediscanx-postgres
    environment:
      POSTGRES_USER: mediscanx
      POSTGRES_PASSWORD: mediscanx_password
      POSTGRES_DB: mediscanx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
